[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
#restart_method: command
baud: 250000
# Option A: Try adding this line if your board hangs on restart
restart_method: arduino

[virtual_sdcard]
path: /home/ben/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


# ====================================================================
# KLIPPER CONFIGURATION SNIPPET: COREXY (X & Y AXES)
# Board: Geeetech GT2560 Rev 3.0 (ATmega2560)
# Drivers: TMC2209 in UART Mode with Sensorless Homing
# Motors: LDO-42STH48-2504AH (Rated 2.5A)
# ====================================================================

[printer]
kinematics: corexy                    # Defines the printer geometry as CoreXY
max_velocity: 300                     # Maximum speed limit for XY moves (mm/s)
max_accel: 3000                       # Maximum acceleration limit (mm/s²)

# --------------------------------------------------------------------
# STEPPER X CONFIGURATION (Typically drives the B motor on CoreXY)
# --------------------------------------------------------------------
[stepper_x]
step_pin: PC0                         # Step pin for X motor on GT2560 v3.0
dir_pin: !PG2                          # Direction pin. Remove '!' if the motor spins backwards
enable_pin: !PC2                      # Enable pin (inverted logic, active low)
microsteps: 16                        # Recommended microstepping for reliability
rotation_distance: 40                 # 40mm for standard 20-tooth GT2 pulleys
#endstop_pin: tmc2209_stepper_x:virtual_endstop # Uses driver StallGuard instead of physical switch
endstop_pin:  !PK5   # using fillament sensor
position_endstop: 0                   # Homing trigger location (0mm coordinate)
position_max: 220                     # Maximum build length of X axis
homing_speed: 40                      # CRITICAL: Keep homing speed constant (between 30-50mm/s) for accurate sensorless homing
homing_retract_dist: 0                # MUST BE 0. Sensorless homing cannot perform normal back-off retractions

# [tmc2209 stepper_x]
# uart_pin: PJ0                         # Software/Hardware UART pin assigned to X driver socket
# interpolate: True                     # Enables internal 256 microstep interpolation for quieter movements
# run_current: 1.2                      # LDO 2504AH is a 2.5A motor. 1.2A RMS provides high torque without overheating TMC2209 sticks
# # hold_current:                       # DO NOT SET HOLD_CURRENT on CoreXY printers. It degrades sensorless consistency
# diag_pin: ^PA0                        # Diag pin connected to microcontroller X-MIN endstop line. (Requires diag jumper installed)
# driver_SGTHRS: 100                    # StallGuard sensitivity (0 = least sensitive, 255 = most sensitive). Tune this carefully!

# --------------------------------------------------------------------
# STEPPER Y CONFIGURATION (Typically drives the A motor on CoreXY)
# --------------------------------------------------------------------
[stepper_y]
step_pin: PC6                         # Step pin for Y motor on GT2560 v3.0
dir_pin: PC4                          # Direction pin. Remove '!' if the motor spins backwards
enable_pin: !PA7                      # Enable pin (inverted logic, active low)
microsteps: 16                        # Recommended microstepping
rotation_distance: 40                 # 40mm for standard 20-tooth GT2 pulleys
# endstop_pin: tmc2209_stepper_y:virtual_endstop # Uses driver StallGuard instead of physical switch
endstop_pin: !PK4 #using filament sensor
position_endstop: 0                   # Homing trigger location (0mm coordinate)
position_max: 220                     # Maximum build width of Y axis
homing_speed: 40                      # CRITICAL: Keep homing speed identical to X for consistent torque readings
homing_retract_dist: 0                # MUST BE 0. Sensorless homing cannot perform normal back-off retractions

# [tmc2209 stepper_y]
# uart_pin: PJ1                         # Software/Hardware UART pin assigned to Y driver socket
# interpolate: True                     # Enables internal 256 microstep interpolation
# run_current: 1.2                      # Matches X stepper current for identical diagonal kinematics
# # hold_current:                       # DO NOT SET HOLD_CURRENT on CoreXY printers
# diag_pin: ^PA2                        # Diag pin connected to microcontroller Y-MIN endstop line
# driver_SGTHRS: 100                    # Initial tuning threshold. Start at 100 and work up or down

# ====================================================================
# HOMING MACROS (CRITICAL FOR SENSORLESS HOMING)
# CoreXY must home one axis at a time and clear driver registers.
# ====================================================================

# [gcode_macro _HOME_X]
# gcode:
#     # 1. Set current lower for safer homing impacts (optional but recommended)
#     SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.60
#     SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.60
    
#     # 2. Wait for StallGuard registers to clear fully
#     G4 P2000
    
#     # 3. Home the X axis
#     G28 X0
    
#     # 4. Instantly back off away from the physical frame to remove mechanical stress
#     G1 X5 F1200
    
#     # 5. Restore full operating current for regular printing
#     SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.20
#     SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.20

# [gcode_macro _HOME_Y]
# gcode:
#     # 1. Set current lower for safer homing impacts
#     SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.60
#     SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.60
    
#     # 2. Wait for StallGuard registers to clear fully
#     G4 P2000
    
#     # 3. Home the Y axis
#     G28 Y0
    
#     # 4. Instantly back off away from the physical frame
#     G1 Y5 F1200
    
#     # 5. Restore full operating current for regular printing
#     SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.20
#     SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.20

# [homing_override]
# axes: xyz                             # Overrides default G28 behavior for all axes
# gcode:
#     # Conditional logic to safely route homing calls
#     {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

#     {% if home_all or 'X' in params %}
#       _HOME_X                         # Triggers safe X sensorless home routine
#     {% endif %}
    
#     {% if home_all or 'Y' in params %}
#       _HOME_Y                         # Triggers safe Y sensorless home routine
#     {% endif %}
    
#     {% if home_all or 'Z' in params %}
#       G28 Z0                          # Z Homing (assumes a standard Z endstop switch or probe is ready)
#       G1 Z10 F600                     # Clear the bed surface safely
#     {% endif %}

# ====================================================================
# MINIMALIST CNC / PICK-AND-PLACE BYPASS
# ====================================================================

# 1. Fake Z-Axis (Satisfies Klipper's 3-axis movement requirement)
[stepper_z] ####note using extruder 2 slot as original z fucked
step_pin: PL6  ###using dfisplay pin
dir_pin: !PL4
enable_pin: !PG0  ####needed inverting doh !!!
microsteps: 16
rotation_distance: 8.000   # Converted from Marlin 400.0
position_min: -1
endstop_pin: probe:z_virtual_endstop
#endstop_pin: tmc2209_stepper_z:virtual_endstop # Fake endstop so it doesn't look for a switch
position_max: 230
homing_speed: 10.0
homing_retract_dist: 5.0


# 2. Fake Extruder (Satisfies toolhead extrusion math)
# Extruder 0 (Marlin E1)
[extruder]
step_pin: PL3
dir_pin: PL5
enable_pin: !PB6
microsteps: 16
rotation_distance: 7.739 #7.754 # 7.725 #7.529 old calculated by gemini from Marlin 425.0
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_pin: PK3
#sensor_type: EPCOS 100K B57560G104F
sensor_type: Generic 3950
min_temp: -273.15
max_temp: 260
control = pid
pid_kp = 36.033
pid_ki = 1.483
pid_kd = 218.899



max_extrude_cross_section: 5.0
max_extrude_only_velocity: 45
max_extrude_only_accel: 1200     # <-- Add this to smooth out the acceleration ramp
pressure_advance: 0.44 #0.43    # <-- Type your winning number here 0.045  SET TO 0 FOR TESTING
pressure_advance_smooth_time: 0.015 # was 0.04 higher to smmoth out extruder noise
max_extrude_only_distance: 150.0
[firmware_retraction]
retract_length: 1.8 #2      ; Your quiet direct-drive length (use 4.0 if Bowden)  2mm@20mm/s 3mm@30mm/s 4mm@40 mm/s
retract_speed: 20           ; Your tuned safe, quiet speed
unretract_extra_length: 0.2   ; No extra push needed
unretract_speed: 25         ; Matching prime speed

# 3. Suppress Heater Errors (Tells Klipper not to panic because there's no heater attached)
[verify_heater extruder]
max_error: 120
check_gain_time: 999999
hysteresis: 999999
heating_gain: 0.00001

# --- BLTouch & Probing Zones ---
[bltouch]
sensor_pin: ^PC7
control_pin: PB5
pin_move_time: 0.680
x_offset: -37
y_offset: 2
z_offset: 2.295 ### WAS @ 2.235
samples: 3 # trying 2 instead of 3 bc its quicker 
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
sample_retract_dist: 5
# speed: 10 ### trying speed bellow for better results 
pin_up_reports_not_triggered: False
pin_up_touch_mode_reports_triggered: False
probe_with_touch_mode: False

speed: 3.5              # WAS 5.0 This is the "fast" travel speed between points
lift_speed: 20         #  WAS 10
#samples_speed: 2.0

#speed: 5.0              # This is the "fast" travel speed between points
#lift_speed: 10          # Speed at which the probe lifts before moving
#samples_speed: 2.0      # This is the "slow" precision for the actual trigger




[include KAMP_Settings.cfg]

[exclude_object]
